services:
  runner:
    build: .
    image: local/github-actions-runner
    restart: unless-stopped
    environment:
      REPO_URL: ${REPO_URL:?set REPO_URL in the env file}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-}
      RUNNER_LABELS: ${RUNNER_LABELS:-}
    volumes:
      - runner-data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  runner-data:

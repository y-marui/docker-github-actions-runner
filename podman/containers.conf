# Rootless podman inside an unprivileged Docker container: no systemd and no delegated cgroups.
[containers]
cgroups = "disabled"
# Share the runner container's network namespace so no slirp4netns/pasta helper is needed
# and a started service is reachable on localhost.
netns = "host"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"

# Keep image storage in the per-runner volume (a real filesystem, unlike the container's
# overlay layer, so native rootless overlay works) and not in the cache volume that other
# runner containers share.
[storage]
driver = "overlay"
graphroot = "/runner/actions-runner/.containers/storage"
runroot = "/tmp/containers-run"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"

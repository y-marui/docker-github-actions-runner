name: publish

on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, .github/workflows/publish.yml]
  pull_request:
    paths: [Dockerfile, entrypoint.sh, .github/workflows/publish.yml]
  schedule:
    # Weekly rebuild to pick up Ubuntu / apt security updates.
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/y-marui/actions-runner

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Read runner version
        id: ver
        run: echo "runner=$(sed -n 's/^ARG RUNNER_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests only verify that the image builds (amd64, not pushed).
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.runner }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
